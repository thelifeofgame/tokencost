<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>500 - Internal Server Error | TokenCosts AI</title>
  <meta name="robots" content="noindex, follow">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      max-width: 32rem;
      width: 100%;
      text-align: center;
      padding: 2.5rem 2rem;
      border-radius: 1rem;
      background: linear-gradient(180deg, rgba(24, 24, 27, 0.8) 0%, rgba(9, 9, 11, 0.95) 100%);
      border: 1px solid rgba(63, 63, 70, 0.4);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      background-color: rgba(239, 68, 68, 0.1);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.2);
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 1.875rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 0.75rem;
      color: #fafafa;
    }
    p {
      font-size: 0.875rem;
      line-height: 1.5;
      color: #a1a1aa;
      margin-bottom: 1.75rem;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background-color: #4f46e5;
      color: #ffffff;
      box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
    }
    .btn-primary:hover {
      background-color: #4338ca;
    }
    .btn-secondary {
      background-color: rgba(39, 39, 42, 0.6);
      color: #d4d4d8;
      border: 1px solid #3f3f46;
    }
    .btn-secondary:hover {
      background-color: #27272a;
      color: #fafafa;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">500 Server Error</div>
    <h1>Unexpected Server Error</h1>
    <p>Our server encountered an unexpected issue while processing your request. Please try refreshing the page or return to the TokenCosts AI dashboard.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">Return Home</a>
      <a href="/compare/" class="btn btn-secondary">Compare Models</a>
    </div>
  </div>
</body>
</html>
